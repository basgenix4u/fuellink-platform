name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web:
    name: Web (lint, data, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @fuellink/web
      - run: npm run verify:data
      - run: npm run typecheck --workspace @fuellink/web
      - run: npm run build --workspace @fuellink/web

  api:
    name: API (lint, typecheck, unit + integration tests, build)
    runs-on: ubuntu-latest

    # Integration tests run against a real PostgreSQL, so they exercise the
    # ledger triggers, check constraints and transaction behaviour.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fuellink
          POSTGRES_PASSWORD: fuellink
          POSTGRES_DB: fuellink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuellink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fuellink:fuellink@127.0.0.1:5432/fuellink_test?schema=public
      TEST_DATABASE_URL: postgresql://fuellink:fuellink@127.0.0.1:5432/fuellink_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba9876543210
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: localhost
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - run: npm run lint --workspace @fuellink/api
      - run: npm run typecheck --workspace @fuellink/api

      - name: Unit tests
        run: npm run test --workspace @fuellink/api

      - name: Integration tests (real PostgreSQL)
        run: npm run test:e2e --workspace @fuellink/api

      - run: npm run build --workspace @fuellink/api
