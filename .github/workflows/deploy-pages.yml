# Deploys the public static site (landing + /intel + /reports) to GitHub Pages.
# Triggers on every push to main — including the monthly NMDPRA data refresh,
# so published intelligence goes live automatically.
#
# Target URL: https://basgenix4u.github.io/fuellink-platform/
# When fuellink.ng is attached (custom domain / Vercel), drop NEXT_PUBLIC_BASE_PATH
# and point NEXT_PUBLIC_SITE_URL at the domain root — the build is identical.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Data integrity gate before anything is published.
      - run: npm run verify:data
      - run: npm run build --workspace @fuellink/web
        env:
          NEXT_PUBLIC_BASE_PATH: /fuellink-platform
          NEXT_PUBLIC_SITE_URL: https://basgenix4u.github.io/fuellink-platform
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
